<style>
/* 상세 페이지 전용 */
.detail-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:6px}
.detail-head .tk{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.detail-head .nm{color:var(--text-dim);font-size:14px}
.detail-head .px{margin-left:auto;text-align:right}
.detail-head .px .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);
  text-decoration:none;font-size:13px;margin-bottom:16px}
.back:hover{color:var(--text)}

.chart-box{background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
.chart-box canvas{display:block;width:100%}
#priceChart{height:280px}
#volChart{height:170px}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;padding:9px 14px;
  border-top:1px solid var(--border);font-size:11px;color:var(--text-dim)}
.chart-legend span{display:flex;align-items:center;gap:6px}
.swatch{width:14px;height:3px;border-radius:2px;display:inline-block}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden}
.kv > div{background:var(--surface-2);padding:12px 14px}
.kv .k{font-size:11px;color:var(--text-faint);margin-bottom:3px}
.kv .v{font-size:17px;font-weight:700;letter-spacing:-.02em}
.kv .v.up{color:var(--green)}
.kv .v.down{color:var(--red)}
.kv .n{font-size:11px;color:var(--text-dim);margin-top:2px}

.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  font-weight:700;background:rgba(97,112,133,.14);color:var(--text-dim)}
.tag.up{background:rgba(22,130,100,.16);color:var(--green)}
.tag.down{background:rgba(201,83,89,.14);color:var(--red)}

  border-radius:var(--radius);overflow:hidden}

.news li:last-child{border-bottom:none}
.news .when{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;
  line-height:1.5}
.news .t{font-size:13px;line-height:1.5;color:var(--text)}
.news .src{font-size:11px;color:var(--text-dim);margin-top:2px}
.news-note{font-size:11px;color:var(--text-faint);margin:8px 2px 0;line-height:1.6}
.news .when span{display:block}
.read-lines{list-style:none;margin:0 0 12px;padding:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.read-lines li{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--text)}
.read-lines li:last-child{border-bottom:none}
.trend-chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;

.trend-chip.up{color:var(--green);border-color:var(--green)}
.trend-chip.down{color:var(--red);border-color:var(--red)}
/* 임원 거래 — SEC Form 4 장내 매수 · 매도 */
.ins-seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.ins-seg button{font:inherit;font-size:12px;font-weight:600;min-height:36px;padding:0 14px;cursor:pointer;
  border:1px solid var(--border);border-radius:999px;background:var(--surface-2);color:var(--text-dim)}
.ins-seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.ins-who{font-weight:600;color:var(--text)}
.ins-who small{display:block;font-weight:400;font-size:11px;color:var(--text-dim);margin-top:1px}
.tag.plan{background:rgba(97,112,133,.10);color:var(--text-faint);margin-left:4px}
.ins-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 8px}
.ins-mini > div{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ins-mini .k{font-size:11px;color:var(--text-faint)}
.ins-mini .v{font-size:16px;font-weight:700;margin-top:2px}
.ins-mini .v.up{color:var(--green)} .ins-mini .v.down{color:var(--red)}
.ins-mini .n{font-size:11px;color:var(--text-dim);margin-top:2px}
@media (max-width:480px){.news li{grid-template-columns:1fr;gap:2px}
  .news .when span{display:inline;margin-left:6px}}

<body class="wide">
<script src="js/shell.js?v=20261112a"></script>

<main>

  <a class="back" href="index.html">&larr; 목록으로</a>

  <div id="content">
    <div class="state">불러오는 중…</div>
  </div>

</main>

<script src="js/utils.js?v=20261107b"></script>
<script>
/* =========================================================
   종목 상세

   목록에서 종목을 누르면 여기로 온다.
     stock.html?ticker=AAPL

   시세/거래량은 종목마다 파일 하나씩 따로 받는다.
   목록 화면에서 전 종목 시세를 미리 받을 이유가 없다.
   ========================================================= */

const TICKER = (new URLSearchParams(location.search)
  .get("ticker") || "").toUpperCase().trim();

const $ = id => document.getElementById(id);

async function getJSON(path){
  try{
    const r = await fetch(path, {cache:"no-cache"});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

/* 메뉴의 '종목 상세' 로 종목 없이 들어왔을 때 — 티커를 받아 그 종목으로 간다 */
function pickTicker(){
  $("content").innerHTML = `<form class="state" id="pick" style="display:flex;gap:8px;flex-wrap:wrap;
      justify-content:center;align-items:center">
    <label for="pickInput" style="width:100%;margin-bottom:4px">볼 종목의 티커를 넣으세요 (예: NVDA)</label>
    <input id="pickInput" name="ticker" autocomplete="off" autocapitalize="characters" spellcheck="false"
      style="font:inherit;font-size:15px;padding:10px 12px;min-height:44px;width:160px;border:1px solid var(--border);
      border-radius:var(--radius);background:var(--bg);color:var(--text);text-transform:uppercase">
    <button type="submit" style="font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 18px;
      border:0;border-radius:var(--radius);background:var(--brand);color:#fff;cursor:pointer">보기</button>
  </form>`;
  $("pick").addEventListener("submit", e=>{
    e.preventDefault();
    const t = ($("pickInput").value||"").toUpperCase().replace(/[^A-Z0-9.\-]/g,"").trim();
    if(t) location.href = "stock.html?ticker=" + encodeURIComponent(t);
  });
}

function fail(message){
  $("content").innerHTML = `<div class="state">${escapeHTML(message)}</div>`;
}

/* ---------------------------------------------------------
   캔버스 공통

   devicePixelRatio를 반영하지 않으면 고해상도 화면에서
   선이 뭉개진다.
   --------------------------------------------------------- */
function prepare(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,rect.width,rect.height);
  return {ctx, w:rect.width, h:rect.height};
}

const PAD = {l:52, r:14, t:14, b:22};

function scales(points, w, h, lo, hi){
  const n = points.length;
  const span = (hi - lo) || 1;
  return {
    x: i => PAD.l + (w-PAD.l-PAD.r) * (n<2?0.5:i/(n-1)),
    y: v => PAD.t + (h-PAD.t-PAD.b) * (1 - (v-lo)/span)
  };
}

function axis(ctx, w, h, lo, hi, fmt){
  ctx.strokeStyle = "rgba(97,112,133,.14)";
  ctx.fillStyle = "#7A8699";
  ctx.font = "10px -apple-system,sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const v = lo + (hi-lo)*i/4;
    const y = PAD.t + (h-PAD.t-PAD.b)*(1-i/4);
    ctx.beginPath();
    ctx.moveTo(PAD.l, y); ctx.lineTo(w-PAD.r, y); ctx.stroke();
    ctx.fillText(fmt(v), PAD.l-7, y);
  }
}

/* ---------------------------------------------------------
   가격 차트
   신호가 난 날에 표시를 찍고, 목표가/손절가를 선으로 긋는다.
   --------------------------------------------------------- */
function drawPrice(series, marks){
  const canvas = $("priceChart");
  const {ctx, w, h} = prepare(canvas);
  const points = series.points;
  if(points.length < 2){ return; }

  const closes = points.map(p=>p.c).filter(v=>v!=null);
  const extras = [];
  const last = marks[marks.length-1];
  if(last){
    if(last.target!=null) extras.push(last.target);
    if(last.stop!=null) extras.push(last.stop);
  }
  const all = closes.concat(extras);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi-lo)*0.08 || 1;
  lo -= pad; hi += pad;

  const s = scales(points, w, h, lo, hi);
  axis(ctx, w, h, lo, hi, v=>v.toFixed(v<10?2:0));

  /* 목표가 / 손절가 */
  if(last){
    [["target","#168264"],["stop","#C95359"]].forEach(([key,color])=>{
      if(last[key]==null) return;
      ctx.strokeStyle = color; ctx.globalAlpha=.55;
      ctx.setLineDash([4,4]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD.l, s.y(last[key]));
      ctx.lineTo(w-PAD.r, s.y(last[key])); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    });
  }

  /* 종가 */
  ctx.strokeStyle = "#A96C15"; ctx.lineWidth = 1.8;
  ctx.beginPath();
  let started = false;
  points.forEach((p,i)=>{
    if(p.c==null) return;
    if(!started){ ctx.moveTo(s.x(i), s.y(p.c)); started=true; }
    else ctx.lineTo(s.x(i), s.y(p.c));
  });
  ctx.stroke();

  /* 신호 표시

     신호 날짜를 그대로 찾으면 대부분 못 찾는다.
     워크플로는 한국시간 아침에 도는데 그 시각 미국장은
     아직 열린 적이 없어서, 신호는 직전 거래일 종가를
     본다. 주말/휴장일이면 신호 날짜에 해당하는 봉 자체가
     없다.

     그래서 "신호 날짜 이하의 마지막 봉"에 찍는다.
     진입가를 잡은 그 순간과 같은 봉이다.
     벤치마크(QQQ) 정렬에 쓰는 규칙과 같다. */
  const snap = date => {
    let found = -1;
    for(let i=0;i<points.length;i++){
      if(points[i].d <= date) found = i; else break;
    }
    return found;
  };

  const drawn = new Set();
  marks.forEach(m=>{
    const i = snap(m.date);
    if(i < 0 || points[i].c==null) return;
    if(drawn.has(i)) return;   /* 같은 봉에 여러 신호면 하나만 */
    drawn.add(i);
    ctx.beginPath();
    ctx.arc(s.x(i), s.y(points[i].c), 4, 0, Math.PI*2);
    ctx.fillStyle = "#305DDC"; ctx.fill();
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth=1.5; ctx.stroke();
  });
}

/* ---------------------------------------------------------
   거래량 차트

   막대는 그 날의 거래량, 색은 20일 평균 대비 많고 적음.
   거래량은 절대값보다 "평소보다 많았는가"가 읽히는 값이라
   평균선을 같이 긋고 넘긴 날을 진하게 칠한다.
   --------------------------------------------------------- */
function drawVolume(series, marks){
  const canvas = $("volChart");
  const {ctx, w, h} = prepare(canvas);
  const points = series.points;
  const vols = points.map(p=>p.v).filter(v=>v!=null);
  if(vols.length < 2) return;

  const hi = Math.max(...vols) * 1.08;
  const s = scales(points, w, h, 0, hi);

  const compact = v =>
    v >= 1e9 ? (v/1e9).toFixed(1)+"B" :
    v >= 1e6 ? (v/1e6).toFixed(1)+"M" :
    v >= 1e3 ? (v/1e3).toFixed(0)+"K" : String(Math.round(v));

  axis(ctx, w, h, 0, hi, compact);

  /* 각 날짜의 20일 이동평균.
     막대 색과 평균선 둘 다 이 값을 쓴다. */
  const avgAt = [];
  for(let i=0;i<points.length;i++){
    const window = [];
    for(let j=Math.max(0,i-19);j<=i;j++){
      if(points[j].v!=null) window.push(points[j].v);
    }
    avgAt[i] = window.length >= 5
      ? window.reduce((a,b)=>a+b,0)/window.length
      : null;
  }

  /* 신호가 난 봉 (가격 차트와 같은 규칙으로 맞춘다) */
  const signalBars = new Set();
  (marks || []).forEach(m=>{
    let found = -1;
    for(let i=0;i<points.length;i++){
      if(points[i].d <= m.date) found = i; else break;
    }
    if(found >= 0) signalBars.add(found);
  });

  /* 막대.
     평균을 넘긴 날을 진하게 칠한다. 거래량은 절대값보다
     "평소보다 많았는가"가 읽히는 값이다. */
  const bw = Math.max(1, (w-PAD.l-PAD.r)/points.length * 0.62);
  points.forEach((p,i)=>{
    if(p.v==null) return;
    const y = s.y(p.v);
    const avg = avgAt[i];
    ctx.fillStyle = (avg != null && p.v >= avg)
      ? "rgba(48,93,220,.85)"
      : "rgba(48,93,220,.28)";
    ctx.fillRect(s.x(i)-bw/2, y, bw, s.y(0)-y);
  });

  /* 신호 발생일 표시 */
  signalBars.forEach(i=>{
    ctx.fillStyle = "rgba(124,77,204,.85)";
    ctx.fillRect(s.x(i)-1.5, PAD.t, 3, h-PAD.t-PAD.b);
  });

  /* 20일 이동평균선 */
  ctx.strokeStyle = "#A96C15"; ctx.lineWidth = 1.6;
  ctx.beginPath();
  let started=false;
  for(let i=0;i<points.length;i++){
    if(avgAt[i]==null) continue;
    if(!started){ ctx.moveTo(s.x(i), s.y(avgAt[i])); started=true; }
    else ctx.lineTo(s.x(i), s.y(avgAt[i]));
  }
  ctx.stroke();
}

/* ---------------------------------------------------------
   화면 구성
   --------------------------------------------------------- */
/* 최근 뉴스 한 칸.
   뉴스 공급자가 이 종목에 붙인 기사 제목이다. 프로그램의 판단에는 아직
   쓰이지 않으므로 화면에 그렇게 적는다. 시각은 보는 사람의 시간대로. */
function newsWhen(iso){
  const d = new Date(iso);
  if(isNaN(d)) return escapeHTML(iso || "-");
  const md = `${d.getMonth()+1}/${d.getDate()}`;
  const hm = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return `${md}<span>${hm}</span>`;
}

function newsSection(news){
  const items = (news && news.articles) || [];
  return `
    <section>
      <div class="section-title">
        <div class="title">최근 뉴스</div>
        <div class="hint">${items.length ? `최근 ${news.window_days || 14}일 · ${items.length}건` : ""}</div>
      </div>
      ${items.length ? `
        <ul class="news">
          ${items.map(a=>`
            <li>
              <div class="when">${newsWhen(a.published_utc)}</div>
              <div>
                <div class="t">${escapeHTML(a.title)}</div>
                <div class="src">${escapeHTML(a.publisher || "")}</div>
              </div>
            </li>`).join("")}
        </ul>
        <div class="news-note">${escapeHTML(news.note || "")}</div>
      ` : `<div class="state">최근 ${news?.window_days || 14}일 동안 이 종목에 붙은 기사가 없습니다.
        뉴스는 그날 많이 떨어져 있던 종목만 모읍니다.</div>`}
    </section>`;
}

/* 차트 요약 — 수출 단계(export_series.chart_summary)가 계산한 지금 위치.
   판단(사라 · 팔아라)은 적지 않는다. */
function pctCell(v){
  return v!=null ? `<span class="${changeClass(v)}">${fmtPctShort(v)}</span>` : "-";
}

function chartSection(ch){
  if(!ch) return "";
  if(!ch.available){
    return `
    <section>
      <div class="section-title"><div class="title">차트 요약</div></div>
      <div class="state">${escapeHTML(ch.reason || "차트를 읽을 시세가 아직 모자랍니다.")}</div>
    </section>`;
  }
  const tone = ch.trend === "오름 흐름" ? "up" : ch.trend === "내림 흐름" ? "down" : "";
  return `
    <section>
      <div class="section-title">
        <div class="title">차트 요약<span class="trend-chip ${tone}">${escapeHTML(ch.trend || "")}</span></div>
        <div class="hint">${escapeHTML(ch.as_of || "")} 종가 기준</div>
      </div>
      <ul class="read-lines">
        ${(ch.lines || []).map(l=>`<li>${escapeHTML(l)}</li>`).join("")}
      </ul>
      <div class="kv">
        <div><div class="k">20일선</div><div class="v mono">${fmtPrice(ch.ma20)}</div>
          <div class="n">5거래일 전보다 ${ch.ma20_slope_pct!=null?fmtPctShort(ch.ma20_slope_pct):"-"}</div></div>
        <div><div class="k">50일선</div><div class="v mono">${ch.ma50!=null?fmtPrice(ch.ma50):"-"}</div></div>
        <div><div class="k">RSI(14)</div><div class="v mono">${ch.rsi!=null?ch.rsi.toFixed(0):"-"}</div>
          <div class="n">${escapeHTML(ch.rsi_label || "")}</div></div>
        <div><div class="k">${ch.window}거래일 고점 대비</div><div class="v mono">${pctCell(ch.from_high_pct)}</div>
          <div class="n">고점 ${fmtPrice(ch.high)}</div></div>
        <div><div class="k">${ch.window}거래일 저점 대비</div><div class="v mono">${pctCell(ch.from_low_pct)}</div>
          <div class="n">저점 ${fmtPrice(ch.low)}</div></div>
        <div><div class="k">단기 지지 · 저항</div><div class="v mono" style="font-size:14px">${fmtPrice(ch.support20)} · ${fmtPrice(ch.resistance20)}</div>
          <div class="n">최근 20거래일 저가 · 고가</div></div>
        <div><div class="k">하루 움직임</div><div class="v mono">±${ch.daily_move_pct!=null?ch.daily_move_pct.toFixed(1):"-"}%</div>
          <div class="n">최근 20거래일 보통 폭</div></div>
      </div>
      <div class="news-note">${escapeHTML(ch.note || "")}</div>
    </section>`;
}

/* 과거 비슷한 흐름 — outlook.py 가 센 과거 기록의 빈도. 예측이 아니다. */
/* 크게 보이는 숫자는 '고친 값' — 과거 시험에서 같은 비율이 나왔던 종목들이 실제로 오른 비율.
   고친 값이 없는 옛 자료면 닮은 사례의 비율을 그대로 보인다. */
function outlookCell(label, o, base){
  if(!o) return `<div><div class="k">${label}</div><div class="v mono">-</div></div>`;
  const fixed = o.calibrated != null;
  const main = fixed ? o.calibrated : o.rate;
  return `
    <div><div class="k">${label}</div>
      <div class="v mono">${(main*100).toFixed(0)}%</div>
      ${fixed ? `<div class="n">과거 시험으로 고친 값 · 닮은 사례만 보면 ${(o.rate*100).toFixed(0)}%</div>` : ""}
      <div class="n">닮은 사례 가운데 ${fmtPctShort(o.median_pct)} · 절반이 ${fmtPctShort(o.q25_pct)} ~ ${fmtPctShort(o.q75_pct)}</div>
      <div class="n">모든 과거 사례 평균 ${base!=null?(base*100).toFixed(0)+"%":"-"}</div></div>`;
}

function outlookSection(o){
  if(!o) return "";
  const n = (o.up5 && o.up5.n) || (o.up60 && o.up60.n);
  const tk = (o.up5 && o.up5.tickers) || (o.up60 && o.up60.tickers);
  return `
    <section>
      <div class="section-title">
        <div class="title">과거 비슷한 흐름</div>
        <div class="hint">${escapeHTML(o.as_of || "")} 종가 기준 · 비슷한 사례 ${n || "-"}건 (${tk || "-"}개 종목)</div>
      </div>
      <div class="kv">
        ${outlookCell("5거래일 뒤 오른 비율", o.up5, o.base && o.base.up5)}
        ${outlookCell("60거래일 뒤 오른 비율", o.up60, o.base && o.base.up60)}
      </div>
      <div class="news-note">${escapeHTML(o.note || "")}</div>
      <div class="news-note">${escapeHTML(o.reliability || "")}</div>
    </section>`;
}

/* 흔들림 — shake.py 가 매긴 단계. 단계마다 과거에 4주 뒤 크게 빠진 비율과 크게 오른 비율을 함께 보인다. */
function shakeSection(sh){
  const s = sh && sh.tickers && sh.tickers[TICKER];
  if(!s) return "";
  const tier = (sh.tiers || []).find(x => x.key === s.tier) || {};
  const all = (sh.history && sh.history.all) || {};
  const pctv = v => v!=null ? `${Number(v).toFixed(1)}%` : "-";
  return `
    <section>
      <div class="section-title">
        <div class="title">흔들림</div>
        <div class="hint">${escapeHTML(sh.date || "")} 종가 기준 · 살펴본 ${Object.keys(sh.tickers).length}개 종목 안에서</div>
      </div>
      <div class="kv">
        <div><div class="k">단계</div>
          <div class="v">${escapeHTML(tier.name || s.tier)}</div>
          <div class="n">하루에 보통 ±${escapeHTML(s.daily_move_pct)}% 움직임</div></div>
        <div><div class="k">4주 뒤 20% 넘게 빠져 있던 비율</div>
          <div class="v mono">${pctv(tier.down_pct)}</div>
          <div class="n">모든 종목 평균 ${pctv(all.down_pct)}</div></div>
        <div><div class="k">4주 뒤 20% 넘게 올라 있던 비율</div>
          <div class="v mono">${pctv(tier.up_pct)}</div>
          <div class="n">모든 종목 평균 ${pctv(all.up_pct)}</div></div>
      </div>
      <div class="news-note">${escapeHTML(sh.note || "")}</div>

}

/* 임원 거래 — insiders/{T}.json (SEC Form 4 · 장내 매수 P · 매도 S 만 · 매주 토요일 갱신) */
function fmtUSD(v){
  if(v==null) return "—";
  const a = Math.abs(v);
  if(a >= 1e9) return "$" + (v/1e9).toFixed(2) + "B";
  if(a >= 1e6) return "$" + (v/1e6).toFixed(1) + "M";
  if(a >= 1e3) return "$" + Math.round(v/1e3) + "K";
  return "$" + Math.round(v);
}
function fmtShares(v){ return v==null ? "—" : Number(v).toLocaleString("en-US"); }
function insWho(r){
  const role = [r.title, r.role].filter(Boolean);
  const uniq = role.filter((x,i)=>role.indexOf(x)===i);
  return `<span class="ins-who">${escapeHTML(r.who || "이름 없음")}${r.joint?` 외 ${r.joint}명`:""}
    ${uniq.length?`<small>${escapeHTML(uniq.join(" · "))}</small>`:""}</span>`;
}
function insKind(r){
  return (r.kind==="buy" ? '<span class="tag up">매수</span>' : '<span class="tag down">매도</span>')
    + (r.plan===true ? '<span class="tag plan" title="미리 신고해 둔 일정대로 판 것">계획</span>' : "");
}
function insMini(ins){
  if(!ins || !ins.summary) return "";
  const m = ins.summary.m3 || {}, b = m.buy || {}, sl = m.sell || {};
  return `<section class="card sd-box"><h2>임원 거래 <small style="font-weight:400;color:var(--text-dim)">최근 3개월</small></h2>
    <div class="ins-mini">
      <div><div class="k">장내 매수</div><div class="v ${b.filings?"up":""}">${b.filings||0}건</div>
        <div class="n">${b.filings?`${b.people}명 · ${fmtUSD(b.value)}`:"없음"}</div></div>
      <div><div class="k">장내 매도</div><div class="v ${sl.filings?"down":""}">${sl.filings||0}건</div>
        <div class="n">${sl.filings?`${sl.people}명 · ${fmtUSD(sl.value)}${sl.plan_value_pct!=null?` · 계획 ${sl.plan_value_pct}%`:""}`:"없음"}</div></div>
    </div>
    <button type="button" class="sd-more" data-go="insiders">임원 거래 이력 모두 보기 →</button></section>`;
}

  return `<div class="table-scroll"><table class="research-table">
    <thead><tr><th>신고일</th><th>구분</th><th>누가</th><th class="num">금액</th>
      <th class="num">주식 수</th><th class="num">평균 가격</th><th class="num">거래 뒤 보유</th><th>거래일</th></tr></thead>
    <tbody>${list.map(r=>`<tr>
      <td class="mono nowrap">${escapeHTML(r.filed||"-")}</td>
      <td class="nowrap">${insKind(r)}</td>
      <td>${insWho(r)}</td>
      <td class="num mono">${fmtUSD(r.value)}</td>
      <td class="num mono">${fmtShares(r.shares)}</td>
      <td class="num mono">${r.price!=null?fmtPrice(r.price):"—"}</td>
      <td class="num mono">${fmtShares(r.after)}${r.indirect?`<br><small class="faint">간접 포함</small>`:""}</td>
      <td class="mono nowrap">${escapeHTML(r.traded||"-")}${r.traded_to?`<br><small class="faint">~ ${escapeHTML(r.traded_to)}</small>`:""}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

        ${ins.total > rows.length ? `<div class="news-note">최근 ${rows.length}건만 보여 줍니다 (최근 ${ins.years}년 ${ins.total}건).</div>` : ""}`

        장내 매수 · 매도만 보여 줍니다 — 스톡옵션 행사 · 세금 납부용 처분 · 증여 · 회사에서 받은 주식은 뺐습니다.</div>

        매수가 더 눈여겨볼 만하다고 알려져 있습니다. 이 사이트에서는 그것을 아직 시험하지 않았습니다 — 사고팔 신호가 아니라 기록입니다.</div>
    </section>`;
}

const WATCH_KEY = "nr.watchlist.v1";
function watchSet(){ try { return new Set(JSON.parse(localStorage.getItem(WATCH_KEY) || "[]")); } catch(e){ return new Set(); } }
function watchSave(set){ try { localStorage.setItem(WATCH_KEY, JSON.stringify([...set])); } catch(e){} }

/* 요약 탭의 가벼운 종가 선 (SVG). 자세한 차트는 '차트' 탭의 캔버스. */
function sparkSVG(points, target, stop){
  const pts = (points || []).filter(p=>p && p.c!=null);
  if(pts.length < 2) return '<div class="state">시세가 아직 모자랍니다.</div>';
  const W = 600, H = 200, T = 8, B = 8;
  const vals = pts.map(p=>p.c).concat([target, stop].filter(v=>v!=null));
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi-lo)*0.06 || 1;
  const y = v => T + (1 - (v-(lo-pad))/((hi+pad)-(lo-pad))) * (H-T-B);
  const x = i => (i/(pts.length-1))*W;
  const line = pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.c).toFixed(1)}`).join(" ");
  const area = `0,${H} ${line} ${W},${H}`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="최근 ${pts.length}거래일 종가">
      <polygon class="ar" points="${area}"/>
      ${target!=null?`<line class="tg" x1="0" x2="${W}" y1="${y(target)}" y2="${y(target)}"/>`:""}
      ${stop!=null?`<line class="sl" x1="0" x2="${W}" y1="${y(stop)}" y2="${y(stop)}"/>`:""}
      <polyline class="ln" points="${line}"/>
    </svg>
    <div class="lbl"><span>${escapeHTML(pts[0].d)}</span><span>${escapeHTML(pts[pts.length-1].d)}</span></div>
    <div class="legend"><span><i style="border-color:var(--brand)"></i>종가</span>
      ${target!=null?`<span><i style="border-color:var(--green);border-top-style:dashed"></i>목표가</span>`:""}
      ${stop!=null?`<span><i style="border-color:var(--red);border-top-style:dashed"></i>손절가</span>`:""}</div>`;
}

        ${history.length ? `
          <div class="kv" style="margin-bottom:12px">
            <div><div class="k">신호 횟수</div><div class="v mono">${history.length}</div></div>
            <div><div class="k">관측 기간</div>
              <div class="v mono">${escapeHTML(history[history.length-1]?.observation_date||"-")}</div>
              <div class="n">~ ${escapeHTML(history[0]?.observation_date||"-")}</div></div>
          </div>
          <div class="notice-box" style="margin-bottom:12px">
            <strong>고정 기간 승패 표시를 내렸습니다.</strong>
            여기에는 5일 뒤 수익률과 그에 따른 이김 / 짐이 있었습니다.
            5일 · 10일 · 30일은 원래 시장 지수 대비를 재는 눈금이었는데,
            그것이 어느새 투자 판단의 정답처럼 쓰이고 있었습니다.
            같은 신호가 5일과 10일에 승패가 반대로 나오는 경우가
            네 건 중 하나였습니다. 눈금을 목표로 착각한 것입니다.
            지금은 보유 기간을 미리 정하지 않고 종목마다 언제 나갈지를
            스스로 정하는 방식을 검증하는 중이며, 검증이 끝나기 전에는
            성과를 표시하지 않습니다.
          </div>
          <div class="table-scroll">
          <table class="research-table">
            <thead><tr><th>발생일</th><th class="num">진입</th></tr></thead>
            <tbody>
              ${history.map(h=>`<tr><td class="mono">${escapeHTML(h.observation_date||"-")}</td>
                <td class="num mono">${fmtPrice(h.entry_price)}</td></tr>`).join("")}
            </tbody>
          </table>
          </div>
        ` : `<div class="state">이 종목의 신호 기록이 없습니다.</div>`}
      </section>`,
    similar: outlookSection(series && series.outlook) || '<div class="state">비슷한 흐름 통계가 아직 없습니다.</div>',
    news: newsSection(news),
    insiders: insidersSection(ins)
  };

  $("content").innerHTML = `
    <section class="card sd-head">
      <div class="sd-id">
        <div class="sd-tk">${escapeHTML(TICKER)}
          <button type="button" class="star" id="watchBtn" aria-pressed="${watching}"
            aria-label="${escapeHTML(TICKER)} 관심 종목 ${watching?"빼기":"담기"}">${watching?"★":"☆"}</button></div>
        <div class="sd-nm">${escapeHTML(name)}</div>
        <div class="sd-ind">${escapeHTML([latest?.industry, latest?.market_cap_b!=null?"시가총액 "+(latest.market_cap_b>=1000?"$"+(latest.market_cap_b/1000).toFixed(2)+"T":"$"+Number(latest.market_cap_b).toFixed(1)+"B"):null].filter(Boolean).join(" · "))}</div>
      </div>
      <div class="sd-px">
        <div class="v mono">${price!=null?fmtPrice(price):"-"}</div>
        <div class="chg mono ${change!=null?changeClass(change):""}">${change!=null?fmtPctShort(change)+" 전일 대비":""}</div>
        <div class="asof">${asOf?escapeHTML(asOf)+" 종가 기준":""}${latest?" · 오늘 신호 종목":""}</div>
      </div>
    </section>

    <div class="sd-tabs" role="tablist" aria-label="종목 상세">
      ${TABS.map(([k,l])=>`<button type="button" role="tab" id="tab-${k}" aria-controls="panel-${k}" aria-selected="false" tabindex="-1" data-tab="${k}">${l}${k==="news"&&items.length?` <span class="badge">${items.length}</span>`:""}${k==="insiders"&&ins?.summary?.m3?.buy?.filings?` <span class="badge" title="최근 3개월 장내 매수">매수 ${ins.summary.m3.buy.filings}</span>`:""}</button>`).join("")}
    </div>

    ${TABS.map(([k])=>`<div class="sd-panel" role="tabpanel" id="panel-${k}" aria-labelledby="tab-${k}" hidden>${panels[k]}</div>`).join("")}
  `;

  const drawn = {};
  function drawCharts(){
    if(!series || series.points.length < 2) return;
    drawPrice(series, series.signals || []);
    if(volAvailable) drawVolume(series, series.signals || []);
  }
  function show(k, focus){
    if(!TABS.some(t=>t[0]===k)) k = "summary";
    TABS.forEach(([t])=>{
      const on = t===k, b = $("tab-"+t);
      b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1;
      $("panel-"+t).hidden = !on;
    });
    if(focus) $("tab-"+k).focus();
    if(k==="chart"){ drawCharts(); drawn.chart = true; }
    if(location.hash.slice(1)!==k) window.history.replaceState(null, "", k==="summary" ? location.pathname+location.search : "#"+k);
  }
  document.querySelector(".sd-tabs").addEventListener("click", e=>{
    const b = e.target.closest("[role=tab]"); if(b) show(b.dataset.tab);
  });
  document.querySelector(".sd-tabs").addEventListener("keydown", e=>{
    if(e.key!=="ArrowRight" && e.key!=="ArrowLeft" && e.key!=="Home" && e.key!=="End") return;
    const i = TABS.findIndex(([t])=>$("tab-"+t).getAttribute("aria-selected")==="true");
    const n = e.key==="Home" ? 0 : e.key==="End" ? TABS.length-1 : (i + (e.key==="ArrowRight"?1:-1) + TABS.length) % TABS.length;
    e.preventDefault(); show(TABS[n][0], true);
  });
  $("content").addEventListener("click", e=>{
    const g = e.target.closest("[data-go]"); if(g) { show(g.dataset.go); window.scrollTo({top:0}); }
    const f = e.target.closest("[data-ins]");
    if(f && ins){
      document.querySelectorAll("[data-ins]").forEach(b=>b.setAttribute("aria-pressed", String(b===f)));
      $("insTable").innerHTML = insTable(ins.rows || [], f.dataset.ins);
    }
  });
  $("watchBtn").addEventListener("click", ()=>{
    const set = watchSet(), on = !set.has(TICKER);
    if(on) set.add(TICKER); else set.delete(TICKER);
    watchSave(set);
    $("watchBtn").setAttribute("aria-pressed", String(on));
    $("watchBtn").textContent = on ? "★" : "☆";
    $("watchBtn").setAttribute("aria-label", `${TICKER} 관심 종목 ${on?"빼기":"담기"}`);
  });
  show(location.hash.slice(1) || "summary");
  window.addEventListener("hashchange", ()=>show(location.hash.slice(1) || "summary"));

  window.addEventListener("resize", ()=>{
    if($("panel-chart").hidden) return;
    clearTimeout(window.__rt);
    window.__rt = setTimeout(drawCharts, 150);
  });
}

/* ---------------------------------------------------------
   거래량 읽기 보조

   숫자만 던져두면 "3.2M"이 많은 건지 적은 건지 알 수 없다.
   평균 대비 몇 배인지가 실제로 읽히는 값이다.
   --------------------------------------------------------- */
function volTone(ratio){
  if(ratio==null) return "";
  if(ratio >= 2) return "up";
  if(ratio <= 0.5) return "down";
  return "";
}

function volLabel(ratio){
  if(ratio==null) return "";
  if(ratio >= 2) return "평소의 2배 이상";
  if(ratio >= 1.2) return "평소보다 많음";
  if(ratio <= 0.5) return "평소의 절반 이하";
  if(ratio <= 0.8) return "평소보다 적음";
  return "평소 수준";
}

/* 최근 구간에서 평균의 2배를 넘긴 날이 며칠인가 */
function spikes(series){
  const vols = series.points.map(p=>p.v).filter(v=>v!=null);
  if(vols.length < 5) return "-";
  let count = 0;
  for(let i=0;i<series.points.length;i++){
    const v = series.points[i].v;
    if(v==null) continue;
    const window = [];
    for(let j=Math.max(0,i-19);j<=i;j++){
      if(series.points[j].v!=null) window.push(series.points[j].v);
    }
    if(window.length < 5) continue;
    const avg = window.reduce((a,b)=>a+b,0)/window.length;
    if(avg && v >= avg*2) count++;
  }
  return String(count);
}

function fmtCompact(v){
  if(v==null) return "-";
  if(v>=1e9) return (v/1e9).toFixed(2)+"B";
  if(v>=1e6) return (v/1e6).toFixed(1)+"M";
  if(v>=1e3) return (v/1e3).toFixed(0)+"K";
  return String(v);
}

(async function(){
  if(!TICKER){ pickTicker(); return; }
  document.title = TICKER + " · NASDAQ Research";

  /* performance.json 은 더 이상 받지 않는다.
     거기 들어 있는 것은 고정 기간(5일·10일·30일) 성과뿐이고,
     이 화면은 그 틀로 승패를 표시하지 않는다. */
  const [signalsPayload, series, scan, news, shake, ins] = await Promise.all([
    getJSON("signals.json"),
    getJSON(`tickers/${encodeURIComponent(TICKER)}.json`),
    getJSON("latest_signals.json"),
    getJSON(`news/${encodeURIComponent(TICKER)}.json`),
    getJSON("shake.json"),
    getJSON(`insiders/${encodeURIComponent(TICKER)}.json`)
  ]);

  const signals = (signalsPayload?.signals || [])
    .filter(s => s && s.ticker === TICKER);

  /* 고정 기간(5일) 성과를 더 이상 읽지 않는다.
     5일·10일·30일은 시장 지수 대비를 재는 눈금이었는데
     투자 판단의 정답처럼 쓰이고 있었다. 눈금을 목표로
     착각한 것이다. 신호가 난 사실과 진입가만 남긴다. */
  const history = signals.map(s=>{
    return {
      observation_date: s.observation_date,
      entry_price: s.entry_price
    };
  }).sort((a,b)=>(b.observation_date||"").localeCompare(a.observation_date||""));

  const latest = (scan?.signals || []).find(s=>s && s.ticker===TICKER);

  if(!signals.length && !series && !news && !ins){
    fail(`${TICKER} 의 기록을 찾을 수 없습니다.`);
    return;
  }

  render({
    signal: signals[signals.length-1] || null,
    history,
    series,
    latest,
    news,
    shake,
    ins
  });
})();
</script>
