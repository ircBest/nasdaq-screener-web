<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 자산 · NASDAQ Research</title>
<meta name="description" content="실제 계좌의 원화 자산 · 넣은 돈을 뺀 자산 지수 · 월 · 분기 · 거래 내역.">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=20261107b">
<link rel="stylesheet" href="css/terminal.css?v=20261107f">
<style>
/* 내 자산 전용 — 공통 모양은 css/terminal.css */
.as-card { margin-bottom: 14px; }
.as-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; padding: 14px 16px 6px; }
.as-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.as-head .hint { font-size: 11.5px; }
.as-note { margin: 0; padding: 0 16px 14px; font-size: 12px; line-height: 1.7; color: var(--text-dim); }
.as-note b { color: var(--text); }
.chart { padding: 4px 16px 10px; }
.chart svg { display: block; width: 100%; height: 220px; }
.chart .grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart .base { stroke: #C3CBD8; stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.chart .l-me { fill: none; stroke: var(--brand); stroke-width: 2; vector-effect: non-scaling-stroke; }
.chart .l-q { fill: none; stroke: #9AA5B8; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.chart .l-in { fill: none; stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; }
.chart .a-me { fill: #305DDC1A; stroke: none; }
.chart text { font-size: 10.5px; fill: var(--text-faint); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 16px 12px; font-size: 11.5px; color: var(--text-dim); }
.legend i { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
.seg { display: inline-flex; gap: 4px; padding: 0 16px 10px; }
.seg button { min-height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
  color: var(--text-dim); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed=true] { border-color: var(--brand); color: var(--brand); background: #E8EEFC; }
.seg button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
table.scr td small { margin-left: 4px; font-size: 10.5px; color: var(--text-faint); }
table.scr td .tag { margin-left: 4px; }
details.more-days > summary { padding: 10px 16px; cursor: pointer; font-size: 12.5px; color: var(--brand); font-weight: 600; }
details.more-days > summary:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.warnline { margin: 0 0 14px; padding: 11px 14px; border: 1px solid #F0D7A8; border-radius: var(--radius);
  background: #FBF4E6; font-size: 12.5px; line-height: 1.7; color: var(--text-dim); }
.warnline b { color: var(--text); }
@media (max-width: 767px) {
  .chart svg { height: 180px; }
  .seg { width: 100%; box-sizing: border-box; }
  .seg button { flex: 1; }
}
</style>
</head>
<body class="wide">
<script src="js/shell.js?v=20261112a"></script>

<main>

  <a class="back" href="index.html" style="display:inline-flex;
     align-items:center;gap:6px;color:var(--text-dim);
     text-decoration:none;font-size:13px;margin-bottom:16px">
     &larr; 목록으로</a>

  <header>
    <div class="eyebrow"><span class="dot"></span>내 자산</div>
    <h1>내 계좌의 원화 자산</h1>
    <div class="sub" id="sub">넣은 돈과 투자 손익을 따로 봅니다</div>
  </header>

  <div id="content">
    <div style="padding:26px;text-align:center;color:var(--text-dim);
      background:var(--surface-2);border:1px dashed var(--border);
      border-radius:var(--radius)">불러오는 중…</div>
  </div>

</main>

<script>
(function () {
  "use strict";

  const $ = (s, r) => (r || document).querySelector(s);

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  const won = v => v == null ? "—" : Math.round(v).toLocaleString("ko-KR") + "원";
  const swon = v => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("ko-KR") + "원";
  const spct = v => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2) + "%";
  const cls = v => v > 0 ? "plus" : v < 0 ? "minus" : "dim";
  const usd = v => v == null ? "—" : "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const md = d => d ? d.slice(5).replace("-", "/") : "—";

  /* 선 그래프 — series: [{vals, cls}] · 같은 x (날짜) */
  function lineChart(dates, series, opts) {
    const W = opts.w || 1000, H = opts.h || 220, L = 54, R = 10, T = 12, B = 22;
    const all = series.flatMap(s => s.vals.filter(v => v != null));
    if (opts.base != null) all.push(opts.base);
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    if (opts.floor != null && lo < opts.floor && Math.min(...all) >= opts.floor) lo = opts.floor;
    const x = i => L + (W - L - R) * (dates.length > 1 ? i / (dates.length - 1) : 0.5);
    const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    let g = "";
    for (let k = 0; k <= 3; k++) {
      const v = lo + (hi - lo) * k / 3;
      g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>` +
           `<text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${esc(opts.fmt(v))}</text>`;
    }
    if (opts.base != null) g += `<line class="base" x1="${L}" x2="${W - R}" y1="${y(opts.base)}" y2="${y(opts.base)}"/>`;
    const ticks = [0, Math.floor((dates.length - 1) / 2), dates.length - 1];
    ticks.forEach((i, n) => {
      g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${n === 0 ? "start" : n === 2 ? "end" : "middle"}">${esc(md(dates[i]))}</text>`;
    });
    series.forEach(s => {
      const pts = s.vals.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ");
      if (s.area) {
        g += `<polygon class="${s.area}" points="${x(0)},${y(lo)} ${pts} ${x(s.vals.length - 1)},${y(lo)}"/>`;
      }
      g += `<polyline class="${s.cls}" points="${pts}"/>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(opts.label)}">${g}</svg>`;
  }

  function periodTable(rows) {
    const body = rows.slice().reverse().map(r => `<tr>
      <td><b>${esc(r.period)}</b><small>${esc(md(r.start_date))} → ${esc(md(r.end_date))}</small></td>
      <td class="num">${won(r.start_total)}</td>
      <td class="num ${r.flows ? "" : "dim"}">${r.flows ? swon(r.flows) : "없음"}</td>
      <td class="num ${cls(r.pnl_price)}">${swon(r.pnl_price)}</td>
      <td class="num ${cls(r.pnl_fx)}">${swon(r.pnl_fx)}</td>
      <td class="num ${cls(r.pnl)}"><b>${swon(r.pnl)}</b></td>
      <td class="num">${won(r.end_total)}</td>
      <td class="num ${cls(r.ret_pct)}"><b>${spct(r.ret_pct)}</b></td>
      <td class="num ${cls(r.qqq_ret_pct)}">${spct(r.qqq_ret_pct)}</td>
    </tr>`).join("");
    return `<div class="tbl-wrap"><table class="scr"><thead><tr>
      <th>기간</th><th class="num">시작 자산</th><th class="num">넣고 뺀 돈</th>
      <th class="num">주가 손익</th><th class="num">환율 손익</th><th class="num">투자 손익</th>
      <th class="num">끝 자산</th><th class="num">수익률</th><th class="num">QQQ (원화)</th>
    </tr></thead><tbody>${body}</tbody></table></div>`;
  }

  /* 판 거래만 — 지금 들고 있는 종목은 공개하지 않는다 (사용자 2026-11-12) */
  function tradeTable(trades, cum, order) {
    const pos = t => order[t.sell_date + "|" + t.ticker] ?? -1;
    const rows = trades.filter(t => t.status === "매도").slice().sort((a, b) => pos(b) - pos(a));
    if (!rows.length) return `<div class="state">판 거래가 아직 없습니다</div>`;
    const body = rows.map(t => `<tr>
        <td class="c-tk"><a href="stock.html?ticker=${encodeURIComponent(t.ticker)}">${esc(t.ticker)}</a><small>${esc(t.name)}</small></td>
        <td class="num">${t.shares}주</td>
        <td>${t.buy_date ? esc(t.buy_date) : '<span class="dim">모름</span><small>기록 전</small>'}${t.date_estimated ? '<span class="tag t-warn">추정</span>' : ""}</td>
        <td class="num">${usd(t.buy_price)}</td>
        <td class="num">${won(t.buy_krw)}${t.buy_krw_from === "화면" ? "" : "<small>환율 계산</small>"}</td>
        <td>${esc(t.sell_date)}${t.before_start ? '<small>지수 시작 전</small>' : ""}</td>
        <td class="num">${usd(t.sell_price)}</td>
        <td class="num">${won(t.sell_krw)}</td>
        <td class="num ${cls(t.pnl_krw)}"><b>${swon(t.pnl_krw)}</b>${t.pnl_usd != null ? `<small>${t.pnl_usd > 0 ? "+" : t.pnl_usd < 0 ? "−" : ""}$${Math.abs(t.pnl_usd).toFixed(2)}</small>` : ""}</td>
        <td class="num ${cls(t.pnl_pct)}">${spct(t.pnl_pct)}</td>
        <td class="num ${cls(cum[t.sell_date + "|" + t.ticker])}">${swon(cum[t.sell_date + "|" + t.ticker])}</td>
        <td><span class="tag ${t.success ? "t-up" : "t-down"}">${t.success ? "성공" : "실패"}</span></td>
        <td class="num">${t.days_held == null ? '<span class="dim">—</span>' : t.days_held + "일"}</td>
      </tr>`).join("");
    return `<div class="tbl-wrap"><table class="scr"><thead><tr>
      <th>종목</th><th class="num">수량</th><th>산 날</th><th class="num">산 값</th><th class="num">산 금액</th>
      <th>판 날</th><th class="num">판 값</th><th class="num">판 금액</th><th class="num">손익</th><th class="num">손익률</th>
      <th class="num">누적 이익</th><th>결과</th><th class="num">들고 있던 거래일</th>
    </tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function render(d) {
    const n = d.now;
    const cols = d.daily_columns;
    const ix = k => cols.indexOf(k);
    const daily = d.daily;
    const dates = daily.map(r => r[ix("date")]);
    const principal = n.principal_initial_krw != null ? n.principal_initial_krw : d.start.total_krw;
    let invested = principal;
    const investedSeries = daily.map(r => (invested += r[ix("flow_krw")]));
    const pend = n.pending_krw || 0;
    const sold = d.trades.filter(t => t.status === "매도");
    /* 그래프를 실제 폭 · 높이로 그린다 — 늘이면 축 글자가 눌린다 */
    const cw = Math.max(280, Math.round(($("#content").clientWidth || 1000) - 34));
    const chh = window.matchMedia("(max-width: 767px)").matches ? 180 : 220;

    $("#sub").textContent = `${n.date} 미국 종가 · 원·달러 ${n.fx.toLocaleString("ko-KR")}원 기준 · 넣은 돈과 투자 손익을 따로 봅니다`;

    /* 증권사 화면이 종가 계산보다 새로우면 그 숫자를 먼저 보여 준다 (계산은 다음 갱신 때 따라온다) */
    const ls = d.latest_screen && d.latest_screen.newer_than_calc ? d.latest_screen : null;
    const nowTotal = ls ? ls.krw : n.total_with_pending_krw;
    const nowPnl = ls ? ls.krw - (n.invested_krw + pend) : n.pnl_krw;
    const kpis = `<section class="kpis" aria-label="요약">
      <div class="st"><div class="st-k">지금 자산${ls ? ` (증권사 화면 ${esc(md(ls.date))})` : ""}</div><div class="st-v">${won(nowTotal)}</div>
        <div class="st-s">${ls ? `종가 계산 (${esc(md(n.date))}) ${won(n.total_krw)}${pend ? ` + 대기 입금 ${won(pend)}` : ""} · 다음 갱신 때 맞춰집니다`
          : pend ? `종가 평가 ${won(n.total_krw)} + 대기 입금 ${won(pend)}` : `현금 ${won(n.cash_krw)} · 주식 ${won(n.stocks_krw)}`}</div></div>
      <div class="st"><div class="st-k">넣은 돈</div><div class="st-v">${won(n.invested_krw + pend)}</div>
        <div class="st-s">처음 ${won(principal)}${(n.invested_krw + pend - principal) ? ` · 더 넣은 돈 ${swon(n.invested_krw + pend - principal)}` : ""}</div></div>
      <div class="st"><div class="st-k">투자 손익 (넣은 돈 뺌)</div><div class="st-v ${nowPnl > 0 ? "up" : nowPnl < 0 ? "down" : ""}">${swon(nowPnl)}</div>
        <div class="st-s">${ls ? `증권사 화면 − 넣은 돈 · 종가 계산 (${esc(md(n.date))}) ${swon(n.pnl_krw)}` : `처음부터 ${swon(n.pnl_krw)}`}
          — ${esc(md(d.base_date))} 전 ${swon(n.pnl_before_start_krw || 0)} · 그 뒤 주가 ${swon(n.pnl_price_krw)} · 환율 ${swon(n.pnl_fx_krw)}</div></div>
      <div class="st"><div class="st-k">자산 지수 (${esc(md(d.base_date))} = 100)</div><div class="st-v ${n.ret_pct > 0 ? "up" : n.ret_pct < 0 ? "down" : ""}">${n.index.toFixed(2)}</div>
        <div class="st-s">${spct(n.ret_pct)} · 넣은 돈은 지수에 안 들어갑니다</div></div>
      <div class="st"><div class="st-k">같은 기간 QQQ (원화)</div><div class="st-v">${n.qqq_index.toFixed(2)}</div>
        <div class="st-s">${spct(n.qqq_ret_pct)} · 내 지수와 차이 ${(n.index - n.qqq_index > 0 ? "+" : "")}${(n.index - n.qqq_index).toFixed(2)}</div></div>
    </section>`;

    const warn = [];
    (d.estimated || []).forEach(x => warn.push(`<b>${esc(x.ticker)}</b> ${esc(x.what)} ${esc(x.date)} 는 추정입니다`));
    if (pend) warn.push(`<b>대기 입금 ${won(pend)}</b> — 다음 미국 종가부터 자산에 반영됩니다 (지수에는 들어가지 않습니다)`);

    const chart1 = `<section class="card as-card">
      <div class="as-head"><h2>자산 지수</h2><span class="hint">넣고 뺀 돈을 뺀 수익만 · ${esc(d.base_date)} = 100</span></div>
      <div class="chart">${lineChart(dates, [
          { vals: daily.map(r => r[ix("qqq_index")]), cls: "l-q" },
          { vals: daily.map(r => r[ix("index")]), cls: "l-me" }],
          { base: 100, fmt: v => v.toFixed(0), label: "자산 지수와 QQQ (원화)", w: cw, h: chh })}</div>
      <div class="legend"><span><i style="background:var(--brand)"></i>내 자산 지수</span>
        <span><i style="background:#9AA5B8"></i>같은 날 같은 돈을 QQQ 에 넣었다면 (원화)</span></div>
    </section>`;

    const chart2 = `<section class="card as-card">
      <div class="as-head"><h2>자산 금액과 넣은 돈</h2><span class="hint">두 선의 차이가 투자 손익</span></div>
      <div class="chart">${lineChart(dates, [
          { vals: daily.map(r => r[ix("total_krw")]), cls: "l-me", area: "a-me" },
          { vals: investedSeries, cls: "l-in" }],
          { fmt: v => (v / 10000).toFixed(0) + "만", label: "자산 금액과 넣은 돈", w: cw, h: chh })}</div>
      <div class="legend"><span><i style="background:var(--brand)"></i>자산 (원)</span>
        <span><i style="background:var(--amber)"></i>넣은 돈 (원)</span></div>
    </section>`;

    const periodsCard = `<section class="card as-card">
      <div class="as-head"><h2>기간별</h2><span class="hint">투자 손익 = 주가 손익 + 환율 손익 · 넣고 뺀 돈은 따로</span></div>
      <div class="seg" role="group" aria-label="기간 단위">
        <button type="button" data-p="monthly" aria-pressed="true">월 단위</button>
        <button type="button" data-p="quarterly" aria-pressed="false">분기 단위</button>
      </div>
      <div id="periodBox">${periodTable(d.monthly)}</div>
      <p class="as-note" style="padding-top:10px">수익률은 넣고 뺀 돈을 뺀 값입니다. 첫 달 · 이번 달은 다 차지 않은 기간입니다.</p>
    </section>`;

    const flows = d.flows || [];
    const flowsCard = `<section class="card as-card">
      <div class="as-head"><h2>넣고 뺀 돈</h2><span class="hint">수익이 아닙니다 — 지수에서 뺍니다</span></div>
      ${flows.length ? `<div class="tbl-wrap"><table class="scr"><thead><tr>
        <th>날짜 (한국)</th><th>종류</th><th class="num">금액</th><th>반영</th><th>메모</th></tr></thead><tbody>${
        flows.slice().reverse().map(f => `<tr><td>${esc(f.date)}</td><td><span class="tag ${f.krw > 0 ? "t-up" : "t-down"}">${esc(f.kind)}</span></td>
          <td class="num"><b>${swon(f.krw)}</b></td>
          <td>${f.applied_us_close ? esc(f.applied_us_close) + " 미국 종가부터" : '<span class="tag t-warn">대기</span> 다음 미국 종가부터'}</td>
          <td style="white-space:normal;min-width:180px">${esc(f.note)}</td></tr>`).join("")}</tbody></table></div>`
        : `<div class="state">처음 넣은 돈 뒤로 넣고 뺀 돈이 없습니다</div>`}
      <p class="as-note" style="padding-top:10px">처음 넣은 돈 ${won(principal)}. 자산 지수는 매매 기록이 다 있는 ${esc(d.base_date)} (그날 자산 ${won(d.start.total_krw)}) 부터 셉니다.</p>
    </section>`;

    const rz = d.realized || { n: 0, wins: 0, losses: 0, total_krw: 0, series: [] };
    const cum = {}, order = {};
    rz.series.forEach((x, i) => { cum[x.date + "|" + x.ticker] = x.cum_krw; order[x.date + "|" + x.ticker] = i; });
    const rzDates = rz.series.length ? [rz.series[0].date].concat(rz.series.map(x => x.date)) : [];
    const rzVals = [0].concat(rz.series.map(x => x.cum_krw));
    const tradesCard = `<section class="card as-card">
      <div class="as-head"><h2>판 거래 내역</h2><span class="hint">지금 들고 있는 종목은 싣지 않습니다</span></div>
      <section class="kpis" aria-label="판 거래 요약" style="margin:4px 16px 12px">
        <div class="st"><div class="st-k">판 거래</div><div class="st-v">${rz.n}건</div></div>
        <div class="st"><div class="st-k">성공 (수수료 뒤 이익)</div><div class="st-v up">${rz.wins}번</div>
          <div class="st-s">성공률 ${rz.win_rate_pct == null ? "—" : rz.win_rate_pct.toFixed(0) + "%"}</div></div>
        <div class="st"><div class="st-k">실패 (수수료 뒤 손해)</div><div class="st-v ${rz.losses ? "down" : ""}">${rz.losses}번</div></div>
        <div class="st"><div class="st-k">누적 확정 이익</div><div class="st-v ${rz.total_krw > 0 ? "up" : rz.total_krw < 0 ? "down" : ""}">${swon(rz.total_krw)}</div>
          <div class="st-s">거래당 평균 ${rz.avg_pct == null ? "—" : spct(rz.avg_pct)}</div></div>
      </section>
      ${rz.n ? `<div class="chart">${lineChart(rzDates, [{ vals: rzVals, cls: "l-me", area: "a-me" }],
          { base: 0, floor: 0, fmt: v => (v / 10000).toFixed(1) + "만", label: "판 거래 누적 확정 이익", w: cw, h: Math.round(chh * 0.8) })}</div>
        <div class="legend"><span><i style="background:var(--brand)"></i>판 거래가 쌓인 확정 이익 (원 · 수수료 뒤 · 판 날 순서)</span></div>` : ""}
      ${tradeTable(sold, cum, order)}
      <p class="as-note" style="padding-top:10px">언제 얼마에 사서 언제 얼마에 팔았는지입니다. 산 금액 · 판 금액 · 손익 · 손익률은 증권사 실현손익 화면 값
        (수량 × 매수 · 매도 평균가 · 수수료와 환전을 뗀 순손익) 입니다. 날짜는 미국 거래일 기준입니다.
        성공 = 수수료를 뗀 뒤 달러로 이익을 본 거래입니다 (환율로 생긴 손익은 매매 판단이 아니라 뺍니다 — 손익 칸의 작은 글씨가 달러 손익).
        누적 이익은 원화 (환율 포함) 입니다. '지수 시작 전' 거래는 자산 지수 시작 (${esc(d.base_date)}) 전에 끝나 지수에는 없고 누적 이익에만 들어갑니다.
        들고 있는 종목의 금액은 위 자산 · 지수에 들어 있습니다.</p>
    </section>`;

    const recent = daily.slice().reverse();
    const dayRow = r => `<tr><td>${esc(r[ix("date")])}</td>
      <td class="num">${won(r[ix("total_krw")])}</td>
      <td class="num ${r[ix("flow_krw")] ? "" : "dim"}">${r[ix("flow_krw")] ? swon(r[ix("flow_krw")]) : "—"}</td>
      <td class="num ${cls(r[ix("pnl_price_krw")])}">${swon(r[ix("pnl_price_krw")])}</td>
      <td class="num ${cls(r[ix("pnl_fx_krw")])}">${swon(r[ix("pnl_fx_krw")])}</td>
      <td class="num">${won(r[ix("cash_krw")])}</td>
      <td class="num">${r[ix("index")].toFixed(2)}</td></tr>`;
    const dayHead = `<thead><tr><th>날짜</th><th class="num">자산</th><th class="num">넣고 뺀 돈</th><th class="num">주가 손익</th>
      <th class="num">환율 손익</th><th class="num">현금</th><th class="num">지수</th></tr></thead>`;
    const daysCard = `<section class="card as-card">
      <div class="as-head"><h2>날마다 자산 변동</h2><span class="hint">하루 변동 = 넣고 뺀 돈 + 주가 손익 + 환율 손익</span></div>
      <div class="tbl-wrap"><table class="scr">${dayHead}<tbody>${recent.slice(0, 10).map(dayRow).join("")}</tbody></table></div>
      ${recent.length > 10 ? `<details class="more-days"><summary>나머지 ${recent.length - 10}일 보기</summary>
        <div class="tbl-wrap"><table class="scr">${dayHead}<tbody>${recent.slice(10).map(dayRow).join("")}</tbody></table></div></details>` : ""}
    </section>`;

    const checks = d.checks || [];
    const checksCard = checks.length ? `<section class="card as-card">
      <div class="as-head"><h2>증권사 화면과 맞춰 보기</h2><span class="hint">화면의 자산 합계</span></div>
      <div class="tbl-wrap"><table class="scr"><thead><tr><th>화면 날짜</th><th>반영된 미국 종가</th><th class="num">화면</th>
        <th class="num">이 계산</th><th class="num">차이</th></tr></thead><tbody>${
        checks.slice().reverse().map(c => `<tr><td>${esc(c.screen_date)}${c.note ? `<small>${esc(c.note)}</small>` : ""}</td><td>${esc(c.us_close)}</td>
          <td class="num">${won(c.screen_krw)}</td><td class="num">${won(c.calc_krw)}</td>
          <td class="num">${swon(c.diff_krw)} <small>${spct(c.diff_pct)}</small></td></tr>`).join("")}</tbody></table></div>
      <p class="as-note" style="padding-top:10px">증권사는 자기 환율과 실시간 가격을 씁니다. 여기서는 미국 종가와 그날 원·달러 종가를 씁니다.
        그래서 1% 안팎 차이가 납니다.</p>
    </section>` : "";

    $("#content").innerHTML =
      (warn.length ? `<div class="warnline">${warn.join("<br>")}</div>` : "") +
      kpis + chart1 + chart2 + periodsCard + flowsCard + tradesCard + daysCard + checksCard +
      `<p class="as-note" style="padding:0 2px 8px">${esc(d.note)} 갱신 ${esc((d.updated_utc || "").slice(0, 16).replace("T", " "))} UTC.</p>`;

    document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll("[data-p]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      $("#periodBox").innerHTML = periodTable(d[b.dataset.p]);
    }));
  }

  fetch("assets.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      if (!d || !d.daily || !d.daily.length) throw new Error("empty");
      render(d);
    })
    .catch(() => {
      $("#content").innerHTML = `<div class="state">자산 자료가 아직 없습니다. 다음 매일 갱신 뒤에 다시 열어 주세요.</div>`;
    });
})();
</script>
</body>
</html>
