<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 순위 · NASDAQ IT 스크리너</title>
<meta name="description" content="그날 살펴본 종목 전체를 어떤 순서로 세웠는지. 흑자 · 영업현금 · 매출 성장을 함께 적습니다.">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=20261107b">
<link rel="stylesheet" href="css/terminal.css?v=20261107e">
<style>
/* 오늘의 순위 전용 — 공통 표 모양은 css/terminal.css (table.scr) */
table.rk { min-width: 980px; }
table.rk .name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 767px) { table.rk { min-width: 0; } table.rk .name { display: none; } }
</style>
</head>
<body class="wide">
<script src="js/shell.js?v=20261107b"></script>

<main>

  <a class="back" href="index.html" style="display:inline-flex;
     align-items:center;gap:6px;color:var(--text-dim);
     text-decoration:none;font-size:13px;margin-bottom:16px">
     &larr; 목록으로</a>

  <header>
    <div class="eyebrow"><span class="dot"></span>오늘의 순위</div>
    <h1>그날 무엇을 앞에 세웠나</h1>
    <div class="sub">
      살펴본 종목 전체의 순서와 재무 사실을 같이 적습니다
    </div>
  </header>

  <div id="content">
    <div class="empty">불러오는 중…</div>
  </div>

</main>

<script>
const $ = (s, r) => (r || document).querySelector(s);

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[c]));
}

function money(v) {
  return v == null ? '<span class="dim">—</span>' : "$" + Number(v).toFixed(2);
}

function pct(v) {
  if (v == null) return '<span class="dim">—</span>';
  const cls = v > 0 ? "plus" : (v < 0 ? "minus" : "");
  return `<span class="${cls}">${v > 0 ? "+" : ""}${Number(v).toFixed(1)}%</span>`;
}

function cap(v) {
  if (v == null) return '<span class="dim">—</span>';
  return v >= 1 ? `${Number(v).toFixed(1)}B` : `${Math.round(v * 1000)}M`;
}

/* 재무 사실 한 칸. 못 잰 것은 '없음' — 탈락이 아니다. */
function fact(v, yes, no, extra) {
  if (v == null) return '<span class="fact na">자료 없음</span>';
  const tail = extra == null ? "" : ` ${extra > 0 ? "+" : ""}${extra}%`;
  return v ? `<span class="fact yes">${yes}${tail}</span>`
           : `<span class="fact no">${no}${tail}</span>`;
}

const VIEWS = {
  all:    {label: "전체",        keep: r => true},
  profit: {label: "흑자만",      keep: r => r.profit === true},
  three:  {label: "흑자 · 현금 · 성장 모두", keep: r => r.profit && r.cash && r.growth},
};

let DATA = null;
let SHAKE = null;   /* shake.json — 종목별 흔들림 단계 (없으면 칸을 비운다) */
let view = "all";
let query = "";

try { view = localStorage.getItem("rankings.view") || "all"; } catch (e) {}
if (!VIEWS[view]) view = "all";

function rows() {
  const q = query.trim().toUpperCase();
  return (DATA.rows || [])
    .filter(VIEWS[view].keep)
    .filter(r => !q || String(r.ticker).toUpperCase().includes(q)
                    || String(r.name || "").toUpperCase().includes(q));
}

function shakeCell(t) {
  const s = SHAKE && SHAKE.tickers && SHAKE.tickers[t];
  if (!s) return '<td class="m-hide">—</td>';
  const tier = (SHAKE.tiers || []).find(x => x.key === s.tier);
  return `<td class="m-hide"><span class="tier tier-${esc(s.tier)}">${esc(tier ? tier.name : s.tier)}</span><small class="sub">하루 ±${esc(s.daily_move_pct)}%</small></td>`;
}

function table(list) {
  if (!list.length) {
    return '<div class="state">조건에 맞는 종목이 없습니다.</div>';
  }

  const filtered = view !== "all" || query.trim() !== "";

  const body = list.map((r, i) => {
    const href = "stock.html?ticker=" + encodeURIComponent(r.ticker);
    return `<tr data-href="${href}">
      <td class="rk-cell num">${filtered ? i + 1 : r.rank}${
        filtered ? `<small>전체 ${r.rank}위</small>` : ""}</td>
      <td class="c-tk"><a href="${href}">${esc(r.ticker)}</a><span class="m-name">${esc(r.name || "")}</span></td>
      <td class="name c-name" title="${esc(r.name)}"><span>${esc(r.name || "—")}</span><small>${esc(r.industry || "")}</small></td>
      <td class="num">${money(r.price)}</td>
      <td class="num">${pct(r.day_change_pct)}</td>
      <td class="num m-hide">${pct(r.from_high60_pct)}</td>
      <td>${fact(r.profit, "흑자", "적자")}</td>
      <td class="m-hide">${fact(r.cash, "유입", "유출")}</td>
      <td class="m-hide">${fact(r.growth, "성장", "감소", r.revenue_growth_pct)}</td>
      <td class="num m-hide">${cap(r.market_cap_b)}</td>
      ${shakeCell(r.ticker)}
    </tr>`;
  }).join("");

  return `<div class="tbl-wrap"><table class="scr rk">
      <caption class="sr-only">오늘의 순위. 필터를 걸면 왼쪽 숫자는 표시 순서이고, 아래 작은 글씨가 원래 순위입니다.</caption>
      <thead><tr>
        <th class="num" scope="col">${filtered ? "표시 순서" : "순위"}</th><th scope="col">티커</th><th class="c-name" scope="col">기업명</th>
        <th class="num" scope="col">가격</th><th class="num" scope="col">전일 대비</th>
        <th class="num m-hide" scope="col">60일 고점 대비</th>
        <th scope="col">순이익</th><th class="m-hide" scope="col">영업현금</th><th class="m-hide" scope="col">매출</th>
        <th class="num m-hide" scope="col">시가총액</th>
        <th class="m-hide" scope="col">흔들림</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>`;
}

function paint() {
  const list = rows();
  $("#list").innerHTML = table(list);
  $("#count").textContent = `${list.length}종목`;
  document.querySelectorAll(".seg button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.view === view)));
}

function render(d) {
  DATA = d;
  const s = d.summary || {};

  $("#content").innerHTML = `
    <div class="notice-line">${esc(d.note || "")}</div>

    <details class="how">
      <summary>어떻게 읽나요</summary>
      <div>
      <p>${esc(d.observation_date)} 에 살펴본 종목 전체를 기대되는 순서대로
         세웠습니다. <b>1위가 사야 할 종목이라는 뜻이 아닙니다.</b>
         앞쪽과 뒤쪽을 나눠 그 뒤 어떻게 됐는지는
         <a href="positions.html" style="color:var(--blue)">연구 장부</a>에
         따로 적습니다.</p>
      <p>순서는 가격 흐름만 보고 정합니다. 회사가 돈을 버는지는 모릅니다.
         그래서 옆에 <b>재무 사실</b>을 붙였습니다 — 최근 4분기 순이익 합,
         최근 4분기 영업현금흐름 합, 최근 분기 매출이 1년 전 같은 분기보다
         늘었는지. 모두 그날까지 미국 증권거래위원회(SEC)에 제출된 숫자만 씁니다.</p>
      <p><b>자료 없음</b>은 외국 회사나 새로 상장한 회사라 분기 재무가
         없는 경우입니다. 적자라는 뜻이 아닙니다.
         흑자만 걸러 보는 것이 더 낫다는 것도 아직 증명되지 않았습니다.</p>
      </div>
    </details>

    <section class="kpis" aria-label="요약 숫자">
      <div class="st"><div class="st-k">줄 세운 종목</div><div class="st-v">${s.ranked ?? "—"}</div></div>
      <div class="st"><div class="st-k">흑자</div><div class="st-v up">${s.profit ?? "—"}</div></div>
      <div class="st"><div class="st-k">적자</div><div class="st-v down">${s.loss ?? "—"}</div></div>
      <div class="st"><div class="st-k">재무 자료 없음</div><div class="st-v">${s.unknown ?? "—"}</div><div class="st-s">적자로 세지 않음</div></div>
      <div class="st"><div class="st-k">흑자 · 현금 · 성장 모두</div><div class="st-v">${s.all_three ?? "—"}</div></div>
    </section>

    <section class="card tbl-card">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="보기">
          ${Object.entries(VIEWS).map(([k, v]) =>
            `<button type="button" data-view="${k}" aria-pressed="false">${v.label}</button>`
          ).join("")}
        </div>
        <input id="q" type="search" placeholder="티커 · 기업명 찾기" aria-label="종목 찾기" autocomplete="off">
        <span class="count" id="count"></span>
      </div>
      <div id="list"></div>
    </section>

    <div class="page-foot">
      가격은 ${esc(d.price_date || "—")} 종가입니다. 60일 고점 대비는 그날까지
      60거래일 중 가장 높은 종가와 비교한 것입니다.<br>
      이 순서는 투자 권유가 아닙니다. 맞는지는 아직 증명되지 않았습니다.<br>
      관측일 ${esc(d.observation_date || "—")} · 갱신 ${esc((d.generated_at || "").slice(0, 16).replace("T", " "))} UTC
    </div>`;

  $("#list").addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const tr = e.target.closest("tr[data-href]");
    if (tr && !window.getSelection().toString()) location.href = tr.dataset.href;
  });

  document.querySelectorAll(".seg button").forEach(b =>
    b.addEventListener("click", () => {
      view = b.dataset.view;
      try { localStorage.setItem("rankings.view", view); } catch (e) {}
      paint();
    }));

  let t = null;
  $("#q").addEventListener("input", e => {
    clearTimeout(t); t = setTimeout(() => { query = e.target.value; paint(); }, 150);
  });

  paint();
}

(async () => {
  try {
    const [r, s] = await Promise.all([
      fetch("rankings.json", {cache: "no-cache"}),
      fetch("shake.json", {cache: "no-cache"}).catch(() => null),
    ]);
    if (!r.ok) throw new Error(r.status);
    try { SHAKE = s && s.ok ? await s.json() : null; } catch (e) { SHAKE = null; }
    render(await r.json());
  } catch (e) {
    $("#content").innerHTML =
      '<div class="state">아직 순위가 없습니다. 다음 갱신에 생깁니다.</div>';
  }
})();
</script>

</body>
</html>
