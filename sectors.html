<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>업종 순위 · NASDAQ IT 스크리너</title>
<meta name="description" content="어느 업종이 오르고 어느 업종이 빠지는지. 업종마다 최근 20 · 60거래일 흐름과 50일선 위 종목 비율을 모았습니다.">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=20261107b">
<link rel="stylesheet" href="css/terminal.css?v=20261107f">
<style>
/* 업종 모니터 전용 — 공통 표 모양은 css/terminal.css (table.scr) */
table.sx { min-width: 860px; }
table.sx .leaders a { margin-right: 8px; color: var(--brand); text-decoration: none; font-size: 12px; }
table.sx .leaders a:hover { text-decoration: underline; }
table.sx td.nm { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
table.sx a.ind-link { color: var(--brand); font-weight: 700; text-decoration: none; }
table.sx a.ind-link:hover { text-decoration: underline; }
.ref-line { padding: 0 16px 10px; font-size: 12.5px; color: var(--text-dim); }
.sx-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
@media (max-width: 767px) { table.sx { min-width: 0; } }
</style>
</head>
<body class="wide">
<script src="js/shell.js?v=20261112a"></script>

<main>

  <a class="back" href="index.html" style="display:inline-flex;
     align-items:center;gap:6px;color:var(--text-dim);
     text-decoration:none;font-size:13px;margin-bottom:16px">
     &larr; 목록으로</a>

  <header>
    <div class="eyebrow"><span class="dot"></span>업종 모니터</div>
    <h1>어느 업종이 오르고 어디가 빠지나</h1>
    <div class="sub">
      업종마다 최근 흐름을 모아 순서를 세웠습니다
    </div>
  </header>

  <div id="content">
    <div class="empty">불러오는 중…</div>
  </div>

</main>

<script>
const $ = (s, r) => (r || document).querySelector(s);

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[c]));
}

function pct(v) {
  if (v == null) return '<span class="dim">—</span>';
  const cls = v > 0 ? "plus" : (v < 0 ? "minus" : "");
  return `<span class="${cls}">${v > 0 ? "+" : ""}${Number(v).toFixed(1)}%</span>`;
}

function chip(t) {
  const cls = t === "오르는 중" ? "up" : (t === "내리는 중" ? "down" : "mix");
  return `<span class="chip ${cls}">${esc(t || "—")}</span>`;
}

/* 20일 수익 막대 — 가운데가 0. 가장 큰 절댓값을 끝으로 둔다. */
function vbar(v, span) {
  if (v == null || !span) return '<span class="dim">—</span>';
  const w = Math.min(50, Math.abs(v) / span * 50);
  const left = v >= 0 ? 50 : 50 - w;
  const color = v >= 0 ? "var(--green)" : "var(--red)";
  return `<span class="vbar"><span class="track" aria-hidden="true"><i style="left:${left}%;width:${w}%;background:${color}"></i></span><span class="n">${pct(v)}</span></span>`;
}

const SORTS = {
  rank: {label: "종합 순위", key: r => r.rank, asc: true},
  r20:  {label: "20일",     key: r => r.r20,  asc: false},
  r60:  {label: "60일",     key: r => r.r60,  asc: false},
  r5:   {label: "5일",      key: r => r.r5,   asc: false},
};

let DATA = null;
let sort = "rank";
try { sort = localStorage.getItem("sectors.sort") || "rank"; } catch (e) {}
if (!SORTS[sort]) sort = "rank";

function sorted(list) {
  const s = SORTS[sort];
  return list.slice().sort((a, b) => {
    const x = s.key(a), y = s.key(b);
    if (x == null && y == null) return a.rank - b.rank;
    if (x == null) return 1;
    if (y == null) return -1;
    return s.asc ? x - y : y - x;
  });
}

function spans(list) {
  const m = k => Math.max(1, ...list.map(r => Math.abs(r[k] || 0)));
  return {r5: m("r5"), r20: m("r20"), r60: m("r60")};
}

function industryTable(list) {
  if (!list.length) return '<div class="state">업종 자료가 아직 없습니다.</div>';
  const sp = spans(list);
  return `<div class="tbl-wrap"><table class="scr sx">
    <caption class="sr-only">우리가 살펴보는 종목의 업종별 중간값</caption>
    <thead><tr>
      <th class="num" scope="col">#</th><th scope="col">업종</th>
      <th class="num" scope="col">5일</th><th class="num" scope="col">20일</th><th class="num" scope="col">60일</th>
      <th class="num m-hide" scope="col">50일선 위</th><th scope="col">추세</th><th class="m-hide" scope="col">20일 상위 종목</th>
    </tr></thead>
    <tbody>${sorted(list).map(r => { const href = "industry.html?industry=" + encodeURIComponent(r.industry); return `<tr data-href="${href}">
      <td class="num rk-cell">${r.rank}</td>
      <td class="nm" title="${esc(r.industry)}"><a class="ind-link" href="${href}">${esc(r.name)}</a><small class="sub">${r.count}종목 · ${esc(r.industry)}</small></td>
      <td class="num">${vbar(r.r5, sp.r5)}</td>
      <td class="num">${vbar(r.r20, sp.r20)}</td>
      <td class="num">${vbar(r.r60, sp.r60)}</td>
      <td class="num m-hide">${r.above50 == null ? '<span class="dim">—</span>' : r.above50 + "%"}</td>
      <td>${chip(r.trend)}</td>
      <td class="m-hide leaders">${(r.leaders || []).map(x =>
        `<a href="stock.html?ticker=${encodeURIComponent(x.ticker)}">${esc(x.ticker)} ${pct(x.r20)}</a>`).join("")}</td>
    </tr>`; }).join("")}</tbody></table></div>`;
}

function marketTable(list) {
  if (!list.length) return '<div class="state">시장 섹터 시세는 다음 갱신부터 실립니다.</div>';
  const sp = spans(list);
  return `<div class="tbl-wrap"><table class="scr sx">
    <caption class="sr-only">미국 시장 전체 섹터 ETF 11개</caption>
    <thead><tr>
      <th class="num" scope="col">#</th><th scope="col">섹터 · ETF</th>
      <th class="num" scope="col">5일</th><th class="num" scope="col">20일</th><th class="num" scope="col">60일</th>
      <th class="num m-hide" scope="col">50일선 대비</th><th scope="col">추세</th>
    </tr></thead>
    <tbody>${sorted(list).map(r => `<tr>
      <td class="num rk-cell">${r.rank}</td>
      <td class="nm">${esc(r.name)}<small class="sub">${esc(r.ticker)}</small></td>
      <td class="num">${vbar(r.r5, sp.r5)}</td>
      <td class="num">${vbar(r.r20, sp.r20)}</td>
      <td class="num">${vbar(r.r60, sp.r60)}</td>
      <td class="num m-hide">${pct(r.gap50)}</td>
      <td>${chip(r.trend)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

function paint() {
  $("#industries").innerHTML = industryTable(DATA.industries || []);
  $("#market").innerHTML = marketTable(DATA.market || []);
  document.querySelectorAll(".seg button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
}

function render(d) {
  DATA = d;
  const s = d.summary || {};
  const ref = d.reference;

  $("#content").innerHTML = `
    <div class="notice-line">${esc(d.note || "")}</div>
    <details class="how">
      <summary>어떻게 읽나요</summary>
      <div>
      <p>${esc(d.how || "")}</p>
      <p><b>오르는 중</b>은 20일 수익이 플러스이고 절반 넘는 종목이 50일선 위에 있는 업종,
         <b>내리는 중</b>은 20일 수익이 마이너스이고 50일선 위 종목이 30%가 안 되는 업종입니다.
         나머지는 <b>섞여 있음</b>입니다.</p>
      <p>위쪽 표는 이 사이트가 매일 살펴보는 종목(나스닥 기술주 위주)을 업종으로 묶은 것이라
         에너지 · 헬스케어 같은 업종이 거의 없습니다. 그래서 아래에 미국 시장 전체의
         섹터 ETF 11개를 따로 적습니다.</p>
      </div>
    </details>
    <section class="kpis" aria-label="요약 숫자">
      <div class="st"><div class="st-k">업종</div><div class="st-v">${s.industries ?? "—"}</div></div>
      <div class="st"><div class="st-k">묶은 종목</div><div class="st-v">${s.stocks ?? "—"}</div></div>
      <div class="st"><div class="st-k">오르는 중</div><div class="st-v up">${s.rising ?? "—"}</div></div>
      <div class="st"><div class="st-k">내리는 중</div><div class="st-v down">${s.falling ?? "—"}</div></div>
      ${ref ? `<div class="st"><div class="st-k">${esc(ref.name)}</div><div class="st-v ${ref.r20 > 0 ? "up" : ref.r20 < 0 ? "down" : ""}">${pct(ref.r20)}</div><div class="st-s">20일 · 5일 ${pct(ref.r5)} · 60일 ${pct(ref.r60)}</div></div>` : ""}
    </section>
    <section class="card tbl-card">
      <div class="card-head"><h2>우리가 살펴보는 종목의 업종</h2>
        <div class="seg" role="group" aria-label="정렬">
          ${Object.entries(SORTS).map(([k, v]) =>
            `<button type="button" data-sort="${k}" aria-pressed="false">${v.label}</button>`
          ).join("")}
        </div>
      </div>
      <div class="card-sub">업종 숫자는 그 업종 종목들의 중간값입니다. 막대는 가운데가 0 입니다. 업종을 누르면 그 업종 종목의 순위가 나옵니다.</div>
      <div id="industries"></div>
    </section>
    <section class="card tbl-card">
      <div class="card-head"><h2>미국 시장 전체 섹터</h2></div>
      <div class="card-sub">섹터 ETF 11개의 같은 숫자입니다. 정렬은 위 표와 같습니다.</div>
      <div id="market"></div>
    </section>
    <div class="page-foot">
      가격은 ${esc(d.price_date || "—")} 종가입니다. 5 · 20 · 60일은 거래일 기준입니다.<br>
      지나온 흐름을 모은 순서이며, 앞으로 오를 업종을 맞힌다는 뜻이 아닙니다. 투자 권유가 아닙니다.<br>
      갱신 ${esc((d.generated_at || "").slice(0, 16).replace("T", " "))} UTC
    </div>`;
  $("#industries").addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const tr = e.target.closest("tr[data-href]");
    if (tr && !window.getSelection().toString()) location.href = tr.dataset.href;
  });

  document.querySelectorAll(".seg button").forEach(b =>
    b.addEventListener("click", () => {
      sort = b.dataset.sort;
      try { localStorage.setItem("sectors.sort", sort); } catch (e) {}
      paint();
    }));

  paint();
}

(async () => {
  try {
    const r = await fetch("sectors.json", {cache: "no-cache"});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("#content").innerHTML =
      '<div class="state">아직 업종 순위가 없습니다. 다음 갱신에 생깁니다.</div>';
  }
})();
</script>

</body>
</html>
