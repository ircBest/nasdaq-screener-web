<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학습 현황 · NASDAQ IT 스크리너</title>
<meta name="description" content="스크리너가 지금 무엇을 공부하고 있고, 무엇을 배웠고, 무엇이 아직 안 되는지.">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css?v=20260903a">
<style>
/* 학습 현황 전용 */
.q-card{background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.q-card .q{font-size:19px;font-weight:700;letter-spacing:-.02em;
  margin-bottom:8px;text-wrap:balance}
.q-card .s{display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:700;background:rgba(110,168,254,.15);
  color:#6EA8FE;margin-bottom:10px}
.q-card .d{color:var(--text-dim);font-size:13px;line-height:1.7}

.bars{display:grid;gap:14px;margin-bottom:6px}
.bar-row .top{display:flex;justify-content:space-between;
  align-items:baseline;margin-bottom:6px;gap:10px}
.bar-row .lab{font-size:13px;color:var(--text-dim)}
.bar-row .num{font-size:14px;font-weight:700;letter-spacing:-.01em}
.track{height:8px;border-radius:999px;background:var(--border);
  overflow:hidden}
.fill{height:100%;border-radius:999px;background:#6EA8FE;
  min-width:2px;transition:width .4s ease}

.learn-list{display:grid;gap:12px}
.learn-item{background:var(--surface-2);border:1px solid var(--border);
  border-left:3px solid #3ECF8E;border-radius:var(--radius);
  padding:14px 16px}
.learn-item .w{font-weight:700;font-size:14px;margin-bottom:6px}
.learn-item .why{color:var(--text-dim);font-size:13px;line-height:1.7;
  margin-bottom:8px}
.learn-item .res{font-size:12px;color:var(--text-faint)}
.learn-item .res::before{content:"→ ";color:#3ECF8E}

.gap-list{display:grid;gap:9px}
.gap-item{background:var(--surface-2);border:1px solid var(--border);
  border-left:3px solid #FFB020;border-radius:var(--radius);
  padding:12px 15px;font-size:13px;color:var(--text-dim);line-height:1.6}
</style>
</head>
<body>

<main>

  <a class="back" href="index.html" style="display:inline-flex;
     align-items:center;gap:6px;color:var(--text-dim);
     text-decoration:none;font-size:13px;margin-bottom:16px">
     &larr; 목록으로</a>

  <header>
    <div class="eyebrow"><span class="dot"></span>학습 현황</div>
    <h1>지금 무엇을 배우고 있는가</h1>
    <div class="sub">
      공부하는 과정과 틀린 것까지 그대로 적습니다
    </div>
  </header>

  <div id="content">
    <div class="state" style="padding:26px;text-align:center;
      color:var(--text-dim);background:var(--surface-2);
      border:1px dashed var(--border);border-radius:var(--radius)">
      불러오는 중…
    </div>
  </div>

</main>

<script src="js/utils.js?v=20260903a"></script>
<script>
/* =========================================================
   학습 현황

   learning.json 하나만 읽는다. 그 파일에는 숫자와 진행
   상황만 들어 있다 — 방법은 기술 저장소에만 있다.
   ========================================================= */

const $ = id => document.getElementById(id);

function bar(label, have, need){
  const pct = need > 0
    ? Math.min(100, Math.round(have / need * 100))
    : 0;

  return `
    <div class="bar-row">
      <div class="top">
        <span class="lab">${escapeHTML(label)}</span>
        <span class="num mono">${have} / ${need}</span>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    </div>`;
}

function cell(k, v){
  return `<div><div class="k">${escapeHTML(k)}</div>
    <div class="v mono">${escapeHTML(String(v ?? "-"))}</div></div>`;
}

function render(d){
  const now = d["지금 하고 있는 것"] || {};
  const col = d["모으고 있는 것"] || {};
  const gate = d["판정까지 남은 것"] || {};
  const learned = d["지금까지 배운 것"] || [];
  const gaps = d["아직 안 되는 것"] || [];

  $("content").innerHTML = `

    <div class="q-card">
      <div class="s">${escapeHTML(now["상태"] || "-")}</div>
      <div class="q">${escapeHTML(now["질문"] || "-")}</div>
      <div class="d">${escapeHTML(now["설명"] || "")}</div>
    </div>

    <section>
      <div class="section-title"><div class="title">판정까지</div></div>
      <div class="bars">
        ${bar("결정을 봉인한 날",
              gate["결정을 봉인한 날"] ?? 0, gate["필요한 날"] ?? 0)}
        ${bar("봉인된 판단",
              gate["봉인된 판단"] ?? 0, gate["필요한 판단"] ?? 0)}
      </div>
      <div class="notice-box" style="margin-top:14px">
        ${escapeHTML(gate["설명"] || "")}
      </div>
    </section>

    <section>
      <div class="section-title"><div class="title">모으고 있는 것</div></div>
      <div class="kv">
        ${Object.entries(col).map(([k, v]) => cell(k, v)).join("")}
      </div>
    </section>

    <section>
      <div class="section-title">
        <div class="title">지금까지 배운 것</div>
      </div>
      <div class="learn-list">
        ${learned.map(x => `
          <div class="learn-item">
            <div class="w">${escapeHTML(x["무엇"] || "")}</div>
            <div class="why">${escapeHTML(x["왜"] || "")}</div>
            <div class="res">${escapeHTML(x["결과"] || "")}</div>
          </div>`).join("")}
      </div>
    </section>

    <section>
      <div class="section-title">
        <div class="title">아직 안 되는 것</div>
      </div>
      <div class="gap-list">
        ${gaps.map(x => `
          <div class="gap-item">${escapeHTML(x)}</div>`).join("")}
      </div>
    </section>

    <div class="notice-box" style="margin-top:18px">
      ${escapeHTML(d["안내"] || "")}
    </div>
  `;
}

(async function(){
  try{
    const r = await fetch("learning.json", {cache:"no-cache"});

    if(!r.ok) throw new Error("not ok");

    render(await r.json());

  }catch(e){
    $("content").innerHTML = `
      <div class="state" style="padding:26px;text-align:center;
        color:var(--text-dim);background:var(--surface-2);
        border:1px dashed var(--border);border-radius:var(--radius)">
        학습 현황을 아직 불러올 수 없습니다.
      </div>`;
  }
})();
</script>

</body>
</html>
