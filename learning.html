<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연구 현황 · NASDAQ Research</title>
<meta name="description" content="스크리너가 지금 무엇을 공부하고 있고, 무엇을 배웠고, 무엇이 아직 안 되는지.">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=20261107b">
<link rel="stylesheet" href="css/terminal.css?v=20261107f">
<style>
/* 연구 현황 전용 — 공통 모양은 css/terminal.css */
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.jump a { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 17px; background: var(--bg);
  color: var(--text-dim); text-decoration: none; font-size: 12.5px; font-weight: 600; }
.jump a:hover { border-color: var(--brand); color: var(--brand); }
.jump b { color: var(--text-faint); font-weight: 600; }
.lr-top { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; margin-bottom: 14px; }
.lr-prog { padding: 16px 18px; }
.lr-prog .big { display: flex; align-items: baseline; gap: 10px; }
.lr-prog .big b { font-size: 34px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.lr-prog .big span { font-size: 13px; color: var(--text-dim); }
.bar-row { margin-top: 14px; }
.bar-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.bar-row .lab { color: var(--text-dim); font-weight: 600; }
.bar-row .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.bar-row .track { height: 8px; margin-top: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--brand); }
.bar-row .nn { margin-top: 5px; font-size: 11px; color: var(--text-faint); }
.lr-now { padding: 16px 18px; }
.lr-now .s { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #E8EEFC; color: var(--brand); }
.lr-now .q { margin-top: 8px; font-size: 16px; font-weight: 700; line-height: 1.45; }
.lr-now .d { margin-top: 6px; font-size: 12.5px; line-height: 1.7; color: var(--text-dim); }
.lr-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; align-items: start; }
.lr-sec { margin-bottom: 12px; scroll-margin-top: 16px; }
@media (max-width: 1023px) { .lr-sec { scroll-margin-top: 72px; } }
.lr-sec .card-head h2 b { margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--text-faint); }
.qlist { list-style: none; margin: 0; padding: 0 16px 6px; }
.qlist li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.qlist .qq { font-size: 13px; font-weight: 600; line-height: 1.5; }
.qlist .aa { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.6; color: var(--text-dim); }
.qlist .nn { grid-column: 1 / -1; font-size: 11px; color: var(--text-faint); }
.qlist li.muted .qq { color: var(--text-dim); }
.facts { list-style: none; margin: 0; padding: 0 16px 6px; }
.facts li { padding: 10px 0; border-top: 1px solid var(--border); }
.facts .w { font-size: 13px; font-weight: 700; line-height: 1.5; }
.facts .why { margin-top: 3px; font-size: 12px; line-height: 1.6; color: var(--text-dim); }
.facts .res { margin-top: 4px; font-size: 12.5px; line-height: 1.6; color: var(--text); }
.gaps { list-style: none; margin: 0; padding: 0 16px 8px; }
.gaps li { position: relative; padding: 9px 0 9px 16px; border-top: 1px solid var(--border); font-size: 12.5px; line-height: 1.6; color: var(--text-dim); }
.gaps li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.collect { padding: 0 16px 12px; }
.collect .kpis { margin: 0; }
.lr-note { padding: 10px 16px 14px; font-size: 11.5px; line-height: 1.6; color: var(--text-faint); }
/* 함께 진행 중인 연구 (2026-11-07) */
.others { list-style: none; margin: 0; padding: 0 16px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
.others li { padding: 12px 0; border-top: 1px solid var(--border); min-width: 0; }
.others .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.others .nm { font-size: 13.5px; font-weight: 700; line-height: 1.45; }
.others .ds { margin-top: 5px; font-size: 12.5px; line-height: 1.7; color: var(--text-dim); }
.others .nx { margin-top: 6px; font-size: 11px; color: var(--text-faint); }
.others .bar-row { margin-top: 10px; }
.facts .when { display: inline-block; margin-bottom: 2px; font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
@media (max-width: 1023px) { .others { grid-template-columns: 1fr; } }
@media (max-width: 1023px) { .lr-top, .lr-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body class="wide">
<script src="js/shell.js?v=20261112a"></script>

<main>

  <a class="back" href="index.html" style="display:inline-flex;
     align-items:center;gap:6px;color:var(--text-dim);
     text-decoration:none;font-size:13px;margin-bottom:16px">
     &larr; 목록으로</a>

  <header>
    <div class="eyebrow"><span class="dot"></span>연구 현황</div>
    <h1>지금 무엇을 배우고 있는가</h1>
    <div class="sub">
      공부하는 과정과 틀린 것까지 그대로 적습니다
    </div>
  </header>

  <div id="content">
    <div class="state" style="padding:26px;text-align:center;
      color:var(--text-dim);background:var(--surface-2);
      border:1px dashed var(--border);border-radius:var(--radius)">
      불러오는 중…
    </div>
  </div>

</main>

<script src="js/utils.js?v=20261107b"></script>
<script>
/* =========================================================
   학습 현황

   learning.json 하나만 읽는다. 그 파일에는 숫자와 진행
   상황만 들어 있다 — 방법은 기술 저장소에만 있다.
   ========================================================= */

const $ = id => document.getElementById(id);

function bar(label, have, need, note){
  const pct = need > 0 ? Math.min(100, have / need * 100) : 0;
  return `
    <div class="bar-row">
      <div class="top"><span class="lab">${escapeHTML(label)}</span>
        <span class="num mono">${have} / ${need}</span></div>
      <div class="track" role="progressbar" aria-label="${escapeHTML(label)}" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${have}">
        <div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
      ${note ? `<div class="nn">${escapeHTML(note)}</div>` : ""}
    </div>`;
}
function stateChip(st){
  const cls = st === "답을 냈습니다" ? "up" : st === "아직 못 잽니다" ? "mix" : "";
  return `<span class="chip ${cls}">${escapeHTML(st || "-")}</span>`;
}
function render(d){
  const now = d["지금 하고 있는 것"] || {};
  const col = d["모으고 있는 것"] || {};
  const gate = d["판정까지 남은 것"] || {};
  const learned = d["지금까지 배운 것"] || [];
  const gaps = d["아직 안 되는 것"] || [];
  const asking = d["지금 연구 중인 질문"] || [];
  const others = d["함께 진행 중인 연구"] || [];
  /* 날짜가 있는 사실 (새로 확인한 것) 을 먼저, 그다음 예전 것 — 둘 다 최근 것부터 */
  const facts = learned.filter(x => x["언제"]).reverse().concat(learned.filter(x => !x["언제"]).reverse());

  /* 진행률은 '채점까지 끝난' 판단 수로 낸다. 봉인 수로 내면 채점 0건인데도 가득 찬 것처럼 보였다 (2026-10-03). */
  const scored = "채점까지 끝난 판단" in gate;
  const have = scored ? (gate["채점까지 끝난 판단"] ?? 0) : (gate["봉인된 판단"] ?? 0);
  const need = gate["필요한 판단"] ?? 0;
  const ratio = need > 0 ? Math.min(100, have / need * 100) : 0;

  $("content").innerHTML = `
    <nav class="jump" aria-label="이 페이지 안에서 이동">
      ${others.length ? `<a href="#others">함께 진행 중인 연구 <b>${others.length}</b></a>` : ""}
      <a href="#ask">연구 질문 <b>${asking.length}</b></a>
      <a href="#collect">수집 중인 정보</a>
      <a href="#gate">검증 진행</a>
      <a href="#learned">확인된 사실 <b>${learned.length}</b></a>
      <a href="#gaps">아직 검증할 수 없는 것 <b>${gaps.length}</b></a>
    </nav>

    <div class="lr-top">
      <section class="card lr-prog" id="gate" aria-label="검증 진행">
        <div class="section-title" style="margin:0"><div class="title">검증 진행</div><div class="hint">채점까지 끝난 판단 기준</div></div>
        <div class="big"><b>${ratio.toFixed(1)}%</b><span>${scored ? "채점 끝난 판단" : "봉인된 판단"} ${have} / ${need}</span></div>
        ${"채점까지 끝난 날" in gate
          ? bar("채점까지 끝난 날", gate["채점까지 끝난 날"] ?? 0, gate["필요한 날"] ?? 0,
                `결정을 봉인한 날 ${gate["결정을 봉인한 날"] ?? 0}일 — 봉인 뒤 60거래일이 지나야 채점합니다`)
          : bar("결정을 봉인한 날", gate["결정을 봉인한 날"] ?? 0, gate["필요한 날"] ?? 0)}
        ${scored
          ? bar("채점까지 끝난 판단", gate["채점까지 끝난 판단"] ?? 0, need, `봉인된 판단 ${gate["봉인된 판단"] ?? 0}건`)
          : bar("봉인된 판단", gate["봉인된 판단"] ?? 0, need)}
        <div class="bar-row"><div class="nn">${escapeHTML(gate["설명"] || "")}</div></div>
      </section>
      <section class="card lr-now" aria-label="지금 하고 있는 것">
        <div class="section-title" style="margin:0 0 8px"><div class="title">지금 하고 있는 것</div></div>
        <span class="s">${escapeHTML(now["상태"] || "-")}</span>
        <div class="q">${escapeHTML(now["질문"] || "-")}</div>
        <div class="d">${escapeHTML(now["설명"] || "")}</div>
      </section>
    </div>

    ${others.length ? `<section class="card lr-sec" id="others">
      <div class="card-head"><h2>함께 진행 중인 연구 <b>${others.length}</b></h2></div>
      <div class="card-sub">매매 판단 말고 같이 돌고 있는 연구입니다. 개수와 날짜만 싣고, 판정 전 성적은 싣지 않습니다 — 중간에 보고 멈추면 우연이 합격으로 보이기 쉽습니다.</div>
      <ul class="others">
        ${others.map(o => {
          const prog = o["진행"];
          const rows = Array.isArray(prog) ? prog : (prog ? [prog] : []);
          return `<li>
            <div class="h"><div class="nm">${escapeHTML(o["이름"] || "")}</div>${stateChip(o["상태"])}</div>
            <div class="ds">${escapeHTML(o["설명"] || "")}</div>
            ${rows.map(r => bar(r["이름"] || "", r["지금"] ?? 0, r["필요"] ?? 0)).join("")}
            ${o["다음"] ? `<div class="nx">다음 · ${escapeHTML(o["다음"])}</div>` : ""}
          </li>`;
        }).join("")}
      </ul>
    </section>` : ""}

    <div class="lr-grid">
      <div>
        <section class="card lr-sec" id="ask">
          <div class="card-head"><h2>연구 질문 <b>${asking.length}</b></h2></div>
          <div class="card-sub">질문은 결과를 보기 전에 먼저 적어 둡니다. 답이 마음에 안 든다고 질문을 고치지 않습니다.</div>
          <ul class="qlist">
            ${asking.map(q => `<li${q["상태"] === "아직 못 잽니다" ? ' class="muted"' : ""}>
              <div class="qq">${escapeHTML(q["질문"] || "")}</div>${stateChip(q["상태"])}
              <div class="aa">${escapeHTML(q["지금까지"] || q["왜"] || "")}</div>
              ${q["답을 낸 날"] ? `<div class="nn">답을 낸 날 ${escapeHTML(q["답을 낸 날"])}</div>` : ""}
              ${q["못 잰 기간"] ? `<div class="nn">못 잰 기간 · ${escapeHTML(q["못 잰 기간"])}</div>` : ""}
            </li>`).join("")}
          </ul>
        </section>

        <section class="card lr-sec" id="learned">
          <div class="card-head"><h2>지금까지 확인된 사실 <b>${learned.length}</b></h2></div>
          <ul class="facts">
            ${facts.map(x => `<li>
              ${x["언제"] ? `<span class="when">${escapeHTML(x["언제"])}</span>` : ""}
              <div class="w">${escapeHTML(x["무엇"] || "")}</div>
              <div class="why">${escapeHTML(x["왜"] || "")}</div>
              <div class="res">${escapeHTML(x["결과"] || "")}</div>
            </li>`).join("")}
          </ul>
        </section>
      </div>

      <div>
        <section class="card lr-sec" id="collect">
          <div class="card-head"><h2>수집 중인 정보</h2></div>
          <div class="collect"><div class="kpis">
            ${Object.entries(col).map(([k, v]) => `<div class="st"><div class="st-k">${escapeHTML(k)}</div>
              <div class="st-v">${escapeHTML(String(v ?? "-"))}</div></div>`).join("")}
          </div></div>
        </section>

        <section class="card lr-sec" id="gaps">
          <div class="card-head"><h2>아직 검증할 수 없는 것 <b>${gaps.length}</b></h2></div>
          <ul class="gaps">${gaps.map(x => `<li>${escapeHTML(x)}</li>`).join("")}</ul>
        </section>

        <section class="card lr-sec">
          <div class="lr-note">${escapeHTML(d["안내"] || "")}</div>
        </section>
      </div>
    </div>
  `;
}
(async function(){
  try{
    const r = await fetch("learning.json", {cache:"no-cache"});

    if(!r.ok) throw new Error("not ok");

    render(await r.json());

  }catch(e){
    $("content").innerHTML = '<div class="state">연구 현황을 아직 불러올 수 없습니다.</div>';
  }
})();
</script>

</body>
</html>
